{% extends "notices/base.html" %}

{% block title %}
Edit Community Post | PUSAT Notice Board
{% endblock %}

{% block content %}

<div class="community-create-page">

    <div class="community-create-card">

        <h1>
            ✏️ Edit Your Post
        </h1>

        <p>
            Update your community announcement.
        </p>

        {% if error %}
            <div class="form-error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>
                    Post Title
                </label>

                <input
                    type="text"
                    name="title"
                    value="{{ post.title }}"
                    maxlength="200"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Category
                </label>

                <select name="category">

                    <option value="">
                        Community
                    </option>

                    {% for category in categories %}

                        <option
                            value="{{ category.category_id }}"
                            {% if category.category_id == post.category_id %}
                                selected
                            {% endif %}
                        >
                            {{ category.category_name }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label>
                    Content
                </label>

                <textarea
                    name="content"
                    rows="8"
                    required
                >{{ post.content }}</textarea>

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="community-pin-button"
                >
                    💾 Save Changes
                </button>

                <a
                    href="{% url 'community_detail' post.post_id %}"
                    class="board-link"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
